server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Serve static assets
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Fallback for single-page setups if needed
  # location / {
  #   try_files $uri $uri/ /index.html;
  # }
}
